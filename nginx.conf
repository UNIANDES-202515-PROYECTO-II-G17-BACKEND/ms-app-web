server {
  listen 8080;
  server_name _;

  # Si tu build deja /browser, mantenlo así. (Si copiaste directo a /html, usa ese root)
  root /usr/share/nginx/html/browser;
  index index.html index.csr.html;

  # 1) Redirección explícita de la raíz
  location = / {
    return 302 /login;
  }

  # 2) Assets fingerprinted: cache agresivo + immutable
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
  }

  # 3) index y env.js sin cache (se revalida en cada despliegue)
  location = /index.html      { add_header Cache-Control "no-store"; }
  location = /index.csr.html  { add_header Cache-Control "no-store"; }
  location = /assets/env.js   { add_header Cache-Control "no-store"; }

  # 4) SPA fallback: si no existe archivo, sirve el CSR
  #    (si prefieres SSR prerender por defecto, cambia el orden a /index.html primero)
  location / {
    try_files $uri $uri/ /index.csr.html;
  }

  # 5) Salud simple
  location = /healthz {
    return 200 "ok";
  }

  # 6) Gzip básico para texto
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
